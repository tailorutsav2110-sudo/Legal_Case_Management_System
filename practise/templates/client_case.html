<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>client_case</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='common_style.css') }}">

</head>
<body>

    <div class="navbar">
        <strong>Case Details</strong>
        <div class="nav-right">
            <a href="/client_dashboard">Dashboard</a>
        </div>
    </div>

    <div class="sliding-title">
        <span>Legal Case Management System</span>
    </div>

    <div class="case-details">
        <h2>{{ case['title'] }}</h2>
        <p><b>Client:</b> {{ case['client'] }}</p>
        <p><b>Lawyer:</b> {{ case['lawyer_name'] }}</p>
        <p><b>Status:</b> {{ case['status'] }}</p>
        <p><b>Description:</b><br>{{ case['description'] }}</p>
    </div>

</body>
</html>
