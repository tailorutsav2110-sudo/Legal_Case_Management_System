<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
}

/* 🔵 Navbar (same as home) */
.navbar {
    background: #1e2f4f;
    color: white;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar .logo {
    font-size: 22px;
    font-weight: bold;
}

.navbar a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

.navbar .btn {
    background: #3b82f6;
    padding: 8px 15px;
    border-radius: 5px;
}

/* 🔥 Contact Box */
.contact-container {
    max-width: 500px;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* Heading */
.contact-container h1 {
    text-align: center;
    color: #1e2f4f;
    margin-bottom: 25px;
}

/* Inputs */
.contact-container input,
.contact-container textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

/* Textarea height */
.contact-container textarea {
    height: 100px;
    resize: none;
}

/* Button */
.contact-container button {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.contact-container button:hover {
    background: #2563eb;
}
</style>

</head>

<body>

<!-- 🔵 Navbar -->
<div class="navbar">
    <div class="logo">⚖️ LCMS</div>
    <div>
        <a href="{{ url_for('auth.home') }}">Home</a>
        <a href="{{ url_for('auth.about') }}">About</a>
        <a href="{{ url_for('auth.contact') }}">Contact</a>
        <a href="{{ url_for('auth.login') }}" class="btn">Login</a>
        <a href="{{ url_for('auth.register') }}" class="btn">Register</a>
    </div>
</div>

<!-- 🔥 Contact Form -->
<div class="contact-container">
    <h1>Contact Us</h1>

    <form method="post">
        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email">

        <label>Message</label>
        <textarea name="message" placeholder="Enter your message"></textarea>

        <button type="submit">Send</button>
    </form>
</div>

</body>
</html>
{% if success %}
<p style="color: green; text-align:center;">Message sent successfully!</p>
{% endif %}
