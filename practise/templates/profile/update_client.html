<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update_client</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='common_style.css') }}">
</head>

<body>
    <div class="navbar">
        <strong>Update Profile</strong>
        <div class="nav-right">
            <a href="/client_dashboard">Dashboard</a><br><br>
        </div>
    </div>

    <div class="sliding-title">
        <span>Legal Case Management System</span>
    </div>

    <form method="POST" action="{{ url_for('client.update_client_profile', id=client['_id']) }}" class="auth-form">
        <label>Name:</label>
        <input type="text" name="name" value="{{ client.name }}" required><br>

        <label>Phone:</label>
        <input type="text" name="phone" value="{{ client.phone or '' }}"><br>

        <label>Address:</label>
        <input type="text" name="address" value="{{ client.address or '' }}"><br>

        <button type="submit">💾 Save Changes</button>
    </form>
</body>

</html>
