<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>staff_profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='common_style.css') }}">
</head>

<body>

    <div class="navbar">
        <strong>Staff Profile</strong>
        <div class="nav-right">
            {% if session['user_id'] == staff['_id']|string %}
            <a href="{{ url_for('staff.update_staff_profile', id=staff['_id']) }}" class="btn-update">
                ✏️ Update Profile
            </a>
            {% endif %}
            <a href="/staff/dashboard">Dashboard</a>
        </div>
    </div>

    <div class="sliding-title">
        <span>Legal Case Management System</span>
    </div>

    <div class="case-details">
        <h2>{{ staff.name }}</h2>
        <p><strong>Email:</strong> {{ staff.email }}</p>
        <p><strong>Phone:</strong> {{ staff.phone or 'Not provided' }}</p>
        <p><strong>Role:</strong> {{ staff.role }}</p>
    </div>

</body>

</html>
